name: Build ScummVM core

# Builds the loader (out/scummvm.bin) and one image per engine (out/scummvm/*.svm) with make
# (firmware SDK vendored in sdk/, ScummVM as a submodule with patches/ applied at build time)
# and keeps them as an artifact. A release gets its zip attached by hand: the files in it are
# the ones tested on the console, and the loader alone is of no use.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core and ScummVM
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: |
          python3 -m pip install pillow
          wget -q -O toolchain.tar.xz \
            https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.2.rel1/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf toolchain.tar.xz -C "$RUNNER_TEMP"
          echo "GCC_PATH=$RUNNER_TEMP/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(nproc)" core

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-${{ github.sha }}
          path: |
            out/scummvm.bin
            out/scummvm/*.svm
            build/arm/scummvm.elf
            build/arm/scummvm.map
          if-no-files-found: error
